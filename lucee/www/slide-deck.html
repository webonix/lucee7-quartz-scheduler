<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quartz Schedule Extension for Lucee Server</title>

  <link rel="shortcut icon" href="/images/qs-favicon.ico" type="image/x-icon">

  <!-- Tailwind & Alpine -->
  <style>
    .slide-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .intro p {
      font-size: 1.125rem;
      margin-top: 0.25rem;
    }
  </style>
  <script defer src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="theme.css">

<!-- ✅ Load Alpine after DOM is parsed -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<script>
  document.addEventListener('alpine:init', () => {
    console.log("alpine:init");
   Alpine.data('presentation', () => ({
      slide: 0,
      bullet: 0,
      slides: [],
      showModal: false,
      currentUrl: '',

      async loadSlides() {
        console.log("presentation component loadSlides");
        const res = await fetch('slides.json');
        const data = await res.json();
        this.slides = data.slides;
      },

      initKeyControls(event) {
        const slides = this.slides;
        const current = this.slide;
        const bullet = this.bullet;
        const bulletCount = slides[current]?.bullets?.length || 0;

        switch (event.key) {
          case 'ArrowRight':
            this.closeModal();
            if (current < slides.length - 1) {
              this.slide++;
              this.bullet = 0;
            }
            break;

          case 'ArrowLeft':
            this.closeModal();
            if (current > 0) {
              this.slide--;
              this.bullet = 0;
            }
            break;

          case 'ArrowDown':
            this.closeModal();
            if (bullet < bulletCount) {
              this.bullet++;
            } else if (current < slides.length - 1) {
              this.slide++;
              this.bullet = 0;
            }
            break;

          case 'ArrowUp':
            this.closeModal();
            if (bullet > 0) {
              this.bullet--;
            } else if (current > 0) {
              this.slide--;
              this.bullet = slides[current - 1]?.bullets?.length || 0;
            }
            break;

          case ' ': // Space key
            event.preventDefault();
            this.tryOpenUrl();
            break;

          case 'Escape': // Space key
            event.preventDefault();
            this.closeModal();
            break;

        }
      },
      init() {
        document.addEventListener('keydown', this.initKeyControls.bind(this));
      },

      tryOpenUrl() {
        const currentSlide = this.slides[this.slide];
        const currentBullet = currentSlide?.bullets?.[this.bullet];
        

        if (currentBullet && currentBullet.url) {
          if (currentBullet.url.startsWith('/')) {
            // Relative URL → open inside modal
            this.currentUrl = currentBullet.url;
            this.showModal = true;
          } else if (currentBullet.url.startsWith('http://') || currentBullet.url.startsWith('https://')) {
            // Full URL → open in new browser tab
            const bulletTarget = currentBullet.target || '_blank';
            window.open(currentBullet.url, bulletTarget);
          }
        }
      },

      closeModal() {
        this.showModal = false;
        this.currentUrl = '';
      }

    }));
 
  });

</script>
    
</head>

<body x-data="presentation()" x-init="loadSlides()"> 

  <!-- Sidebar -->
  <aside class="sidebar fixed left-0 top-0 bottom-0 w-100 p-4 z-20">
    <nav>
      <ul class="space-y-2">
        <template x-for="(s, index) in slides" :key="index">
          <li>
            <button @click="slide = index; bullet = 0"
                    :class="slide === index ? 'bg-blue-600 text-white font-semibold' : 'text-gray-300 hover:text-white'"
                    class="w-full text-left px-3 py-2 rounded transition-colors duration-200">
              <span x-text="s.title"></span>
            </button>
          </li>
        </template>
      </ul>
    </nav>
  </aside>

  <!-- Slides -->
 <main class="ml-64 pt-6 h-screen overflow-hidden relative">
    <header class="slide-header flex items-center justify-start gap-6 mb-6">

        version="1.1"

      </svg>

      <div class="flex flex-col">
        <h1 class="text-4xl font-bold text-green-900">Quartz Schedule Extension for Lucee Server</h1>
        <p class="text-green-700">cfCamp 2025</p>
      </div>
      
    </header>
  
    <ul class="text-xl" style="padding: 20px;">
      <template x-for="(s, index) in slides" :key="index">
        <li
          x-show="slide === index"
          x-transition:enter="transition transform duration-700"
          x-transition:enter-start="translate-y-full opacity-0"
          x-transition:enter-end="translate-y-0 opacity-100"
          x-transition:leave="transition transform duration-700 absolute w-full"
          x-transition:leave-start="translate-y-0 opacity-100"
          x-transition:leave-end="-translate-y-full opacity-0"
          class=""
        >

          <h2 class="text-4xl font-bold text-green-900 mb-4" x-text="s.title"></h2>

          <template x-if="s.intro">
            <div x-html="s.intro" class="intro"></div>
          </template>

          <ul class="pl-6 list-disc">
            <template x-for="(point, i) in s.bullets">
              <li 
              :class="{
                'opacity-30': bullet > i,        /* Faded if already presented */
                'opacity-100 font-bold': bullet === i, /* Current active bullet */
                'opacity-0': bullet < i           /* Hidden before revealing */
              }"
              :style="'margin-left: ' + (point.indent || 0) + 'px'"
              class="transition-opacity duration-500"
              :title="point.url ? `Press Space to open: ${point.url}` : ''"
              >
              <div class="flex items-center gap-2">
                <!-- Bullet text -->
                <span x-html="point.text || point"></span>
        
                <!-- 🔗 Inline Icon if URL exists -->
                <template x-if="point.url && bullet === i">
                  <span>&#128279;</span> 
                </template>
              </div>

            </li>
            </template>
          </ul>
        </li>
      </template>
    </ul>
  </main>

  <div x-show="showModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50" @click.away="closeModal">
    <iframe :src="currentUrl" class="w-11/12 h-5/6 bg-white rounded shadow-lg" frameborder="0"></iframe>
  </div>
  
</body>
</html>
